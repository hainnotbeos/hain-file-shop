<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin - HAIN FILE SHOP</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    padding: 30px;

    font-family: Arial, sans-serif;

    background: #0b0b0f;

    color: white;

}


.container {

    max-width: 900px;

    margin: auto;

}


.box {

    background: #17171e;

    padding: 25px;

    margin-bottom: 20px;

    border-radius: 15px;

}


h1 {

    color: #ff3030;

}


input,
textarea,
select {

    width: 100%;

    padding: 12px;

    margin-top: 8px;

    margin-bottom: 15px;

    background: #222;

    color: white;

    border: 1px solid #444;

    border-radius: 8px;

}


button {

    padding: 12px 18px;

    background: #ff3030;

    color: white;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;

}


button:hover {

    opacity: .8;

}


.order {

    background: #222;

    padding: 18px;

    margin-top: 15px;

    border-radius: 10px;

    border: 1px solid #333;

}


.paid {

    color: #22c55e;

}


.pending {

    color: #facc15;

}


#adminPanel {

    display: none;

}


</style>

</head>


<body>


<div class="container">


<div class="box">


<h1>
⚡ HAIN FILE SHOP
</h1>


<div id="loginBox">


<h2>
🔐 ĐĂNG NHẬP ADMIN
</h2>


<input
    id="adminPassword"
    type="password"
    placeholder="Mật khẩu Admin"
>


<button
    onclick="loginAdmin()"
>

    🔓 ĐĂNG NHẬP

</button>


<p
    id="loginStatus"
>
</p>


</div>



<div id="adminPanel">


<h2>
➕ THÊM SẢN PHẨM
</h2>


<form
    id="productForm"
>


<label>
Tên sản phẩm
</label>


<input
    id="name"
    required
    placeholder="Ví dụ: Aimlock V2"
>


<label>
Mô tả
</label>


<textarea
    id="description"
></textarea>


<label>
Giá VNĐ
</label>


<input
    id="price"
    type="number"
    required
    placeholder="50000"
>


<label>
Danh mục
</label>


<select
    id="category"
>

<option>
Free Fire
</option>

<option>
Minecraft
</option>

<option>
Preset
</option>

<option>
HUD
</option>

<option>
Khác
</option>

</select>


<label>
File bán
</label>


<input
    id="file"
    type="file"
    required
>


<button
    type="submit"
>

    📤 THÊM SẢN PHẨM

</button>


</form>


<p
    id="status"
>
</p>


<button
    onclick="loadOrders()"
>

    🔄 TẢI LẠI ĐƠN HÀNG

</button>


<button
    onclick="logoutAdmin()"
    style="margin-left:10px;background:#444"
>

    🚪 ĐĂNG XUẤT

</button>


</div>


</div>



<div
    class="box"
    id="ordersBox"
    style="display:none"
>


<h2>
📦 QUẢN LÝ ĐƠN HÀNG
</h2>


<div
    id="orders"
>

    Chưa tải đơn hàng.

</div>


</div>


<div class="box">


<a
    href="/"
    style="color:white"
>

    ← Về HAIN FILE SHOP

</a>


</div>


</div>



<script>


// ========================================
// LOGIN
// ========================================

async function loginAdmin() {

    const password =

        document.getElementById(
            "adminPassword"
        ).value;


    const status =

        document.getElementById(
            "loginStatus"
        );


    if (
        !password
    ) {

        status.innerText =
            "❌ Nhập mật khẩu";

        return;

    }


    status.innerText =
        "⏳ Đang kiểm tra...";


    try {

        const response =

            await fetch(
                "/api/admin/login",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:

                        JSON.stringify({

                            password:
                                password

                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                data.error
            );

        }


        sessionStorage.setItem(
            "adminPassword",
            password
        );


        showAdmin();


    } catch (error) {

        status.innerText =

            "❌ " +
            error.message;

    }

}


// ========================================
// HIỆN ADMIN
// ========================================

function showAdmin() {

    document.getElementById(
        "loginBox"
    ).style.display =
        "none";


    document.getElementById(
        "adminPanel"
    ).style.display =
        "block";


    document.getElementById(
        "ordersBox"
    ).style.display =
        "block";


    loadOrders();

}


// ========================================
// LOGOUT
// ========================================

function logoutAdmin() {

    sessionStorage.removeItem(
        "adminPassword"
    );


    location.reload();

}


// ========================================
// THÊM SẢN PHẨM
// ========================================

document
.getElementById(
    "productForm"
)
.addEventListener(

    "submit",

    async function(event) {

        event.preventDefault();


        const password =

            sessionStorage.getItem(
                "adminPassword"
            );


        const fileInput =

            document.getElementById(
                "file"
            );


        if (
            !fileInput.files.length
        ) {

            alert(
                "❌ Chưa chọn file"
            );

            return;

        }


        const formData =
            new FormData();


        formData.append(
            "name",
            document.getElementById(
                "name"
            ).value
        );


        formData.append(
            "description",
            document.getElementById(
                "description"
            ).value
        );


        formData.append(
            "price",
            document.getElementById(
                "price"
            ).value
        );


        formData.append(
            "category",
            document.getElementById(
                "category"
            ).value
        );


        formData.append(
            "file",
            fileInput.files[0]
        );


        formData.append(
            "password",
            password
        );


        const status =

            document.getElementById(
                "status"
            );


        status.innerText =
            "⏳ Đang tải file...";


        try {

            const response =

                await fetch(
                    "/api/admin/products",
                    {

                        method:
                            "POST",

                        body:
                            formData

                    }
                );


            const data =
                await response.json();


            if (
                !response.ok
            ) {

                throw new Error(
                    data.error
                );

            }


            status.innerText =

                "✅ Thêm sản phẩm thành công!";


            document
                .getElementById(
                    "productForm"
                )
                .reset();


        } catch (error) {

            status.innerText =

                "❌ " +
                error.message;

        }

    }

);


// ========================================
// LOAD ĐƠN
// ========================================

async function loadOrders() {

    const password =

        sessionStorage.getItem(
            "adminPassword"
        );


    if (
        !password
    ) {

        return;

    }


    const box =

        document.getElementById(
            "orders"
        );


    box.innerHTML =
        "⏳ Đang tải...";


    try {

        const response =

            await fetch(
                "/api/admin/orders",
                {

                    headers: {

                        "x-admin-password":
                            password

                    }

                }
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                data.error
            );

        }


        if (
            !data.orders.length
        ) {

            box.innerHTML =
                "📭 Chưa có đơn hàng.";

            return;

        }


        box.innerHTML =

            data.orders
                .map(
                    order => `

                    <div class="order">

                        <h3>
                            🧾
                            ${order.order_code}
                        </h3>

                        <p>
                            👤
                            ${escapeHTML(
                                order.customer_name
                            )}
                        </p>

                        <p>
                            🎮
                            ${escapeHTML(
                                order.product_name
                            )}
                        </p>

                        <p>
                            💰
                            ${Number(
                                order.amount
                            ).toLocaleString(
                                "vi-VN"
                            )}
                            VNĐ
                        </p>

                        <p>
                            📧
                            ${escapeHTML(
                                order.customer_email ||
                                "Không có"
                            )}
                        </p>

                        <p>

                            Trạng thái:

                            <strong class="${
                                order.status ===
                                "paid"

                                ? "paid"

                                : "pending"
                            }">

                            ${
                                order.status ===
                                "paid"

                                ? "✅ ĐÃ THANH TOÁN"

                                : "⏳ CHỜ THANH TOÁN"
                            }

                            </strong>

                        </p>


                        ${
                            order.status !==
                            "paid"

                            ?

                            `

                            <button

                                onclick="
                                    confirmPayment(
                                        '${order.order_code}'
                                    )
                                "

                            >

                                💰 XÁC NHẬN ĐÃ NHẬN TIỀN

                            </button>

                            `

                            :

                            `

                            <p class="paid">

                                ✅ Khách có thể tải file.

                            </p>

                            `

                        }

                    </div>

                `
                )
                .join("");


    } catch (error) {

        box.innerHTML =

            "❌ " +
            error.message;

    }

}


// ========================================
// XÁC NHẬN THANH TOÁN
// ========================================

async function confirmPayment(
    orderCode
) {

    const password =

        sessionStorage.getItem(
            "adminPassword"
        );


    const ok =

        confirm(

            "Bạn đã kiểm tra ZaloPay và chắc chắn đã nhận tiền cho đơn " +

            orderCode +

            " chưa?"

        );


    if (
        !ok
    ) {

        return;

    }


    try {

        const response =

            await fetch(

                "/api/admin/orders/" +

                encodeURIComponent(
                    orderCode
                ) +

                "/paid",

                {

                    method:
                        "POST",

                    headers: {

                        "x-admin-password":
                            password

                    }

                }

            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                data.error
            );

        }


        alert(
            "✅ Đã xác nhận thanh toán!"
        );


        loadOrders();


    } catch (error) {

        alert(

            "❌ " +
            error.message

        );

    }

}


// ========================================
// ESCAPE
// ========================================

function escapeHTML(
    text
) {

    return String(
        text
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// ========================================
// TỰ LOGIN
// ========================================

window.addEventListener(

    "DOMContentLoaded",

    function() {

        const password =

            sessionStorage.getItem(
                "adminPassword"
            );


        if (
            password
        ) {

            showAdmin();

        }

    }

);


</script>

</body>

</html>
