<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin - HAIN FILE SHOP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
        }

        .box {
            width: 100%;
            max-width: 700px;
            margin: auto;
            background: #17171e;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-top: 0;
            color: #ff3030;
            text-align: center;
        }

        h2 {
            color: #ff5050;
            margin-top: 30px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            margin-bottom: 18px;
            background: #222229;
            color: white;
            border: 1px solid #444;
            border-radius: 9px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #ff3030;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #ff3030;
            color: white;
            border: none;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .login-title {
            color: #ff3030;
        }

        #loginStatus,
        #status {
            margin-top: 15px;
            line-height: 1.5;
        }

        #adminPanel {
            display: none;
        }

        .logout {
            margin-top: 20px;
            background: #444;
        }

        .back-home {
            display: block;
            margin-top: 25px;
            color: white;
            text-align: center;
            text-decoration: none;
        }

        .back-home:hover {
            color: #ff3030;
        }

        hr {
            margin: 35px 0;
            border: 0;
            border-top: 1px solid #333;
        }

        .product-item {
            background: #222229;
            padding: 18px;
            margin-top: 12px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin-bottom: 8px;
        }

        .product-info {
            color: #bbb;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .delete-button {
            background: #b00020;
        }

        .delete-button:hover {
            background: #d00025;
        }

        .loading {
            color: #aaa;
            text-align: center;
            padding: 15px;
        }

        .empty {
            color: #aaa;
            text-align: center;
            padding: 20px;
            background: #222229;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .box {
                padding: 20px;
            }
        }
    </style>

</head>

<body>

<div class="box">

    <h1>
        ⚡ HAIN FILE SHOP
    </h1>


    <!-- ================================= -->
    <!-- LOGIN ADMIN -->
    <!-- ================================= -->

    <div id="loginBox">

        <h2 class="login-title">
            🔐 ADMIN
        </h2>

        <p>
            Nhập mật khẩu để quản lý sản phẩm.
        </p>

        <input
            id="adminPassword"
            type="password"
            placeholder="Nhập mật khẩu Admin"
        >

        <button
            type="button"
            onclick="loginAdmin()"
        >
            🔓 ĐĂNG NHẬP ADMIN
        </button>

        <div id="loginStatus"></div>

    </div>


    <!-- ================================= -->
    <!-- ADMIN PANEL -->
    <!-- ================================= -->

    <div id="adminPanel">

        <h2>
            ➕ THÊM SẢN PHẨM
        </h2>

        <form id="productForm">

            <label>
                Tên sản phẩm
            </label>

            <input
                id="name"
                type="text"
                required
                placeholder="Ví dụ: Aimlock V2"
            >


            <label>
                Mô tả
            </label>

            <textarea
                id="description"
                placeholder="Mô tả sản phẩm"
            ></textarea>


            <label>
                Giá sản phẩm
            </label>

            <input
                id="price"
                type="number"
                min="0"
                required
                placeholder="50000"
            >


            <label>
                Danh mục
            </label>

            <select id="category">

                <option value="Free Fire">
                    🎮 Free Fire
                </option>

                <option value="Minecraft">
                    ⛏️ Minecraft
                </option>

                <option value="Preset">
                    🧩 Preset
                </option>

                <option value="HUD">
                    🎯 HUD
                </option>

                <option value="Khác">
                    📦 Khác
                </option>

            </select>


            <label>
                File bán
            </label>

            <input
                id="file"
                type="file"
                required
            >


            <button
                type="submit"
            >
                ➕ THÊM SẢN PHẨM
            </button>

        </form>


        <div id="status"></div>


        <hr>


        <!-- ================================= -->
        <!-- QUẢN LÝ SẢN PHẨM -->
        <!-- ================================= -->

        <h2>
            🗑️ QUẢN LÝ SẢN PHẨM
        </h2>

        <div id="productList">

            <div class="loading">
                ⏳ Đang tải sản phẩm...
            </div>

        </div>


        <button
            class="logout"
            type="button"
            onclick="logoutAdmin()"
        >
            🚪 ĐĂNG XUẤT
        </button>

    </div>


    <a
        href="/"
        class="back-home"
    >
        ← Về HAIN FILE SHOP
    </a>

</div>


<script>

// ========================================
// ĐĂNG NHẬP ADMIN
// ========================================

async function loginAdmin() {

    const password =
        document
            .getElementById("adminPassword")
            .value
            .trim();

    const loginStatus =
        document.getElementById("loginStatus");


    if (!password) {

        loginStatus.innerText =
            "❌ Vui lòng nhập mật khẩu";

        return;

    }


    loginStatus.innerText =
        "⏳ Đang kiểm tra...";


    try {

        const response =
            await fetch(
                "/api/admin/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        password: password
                    })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "Mật khẩu không đúng"
            );

        }


        sessionStorage.setItem(
            "adminPassword",
            password
        );


        document
            .getElementById("loginBox")
            .style.display = "none";


        document
            .getElementById("adminPanel")
            .style.display = "block";


        loginStatus.innerText = "";


        // Tải danh sách sản phẩm
        loadAdminProducts();


    } catch (error) {

        loginStatus.innerText =
            "❌ " + error.message;

    }

}


// ========================================
// TỰ ĐỘNG ĐĂNG NHẬP
// ========================================

window.addEventListener(
    "DOMContentLoaded",
    function() {

        const savedPassword =
            sessionStorage.getItem(
                "adminPassword"
            );


        if (savedPassword) {

            document
                .getElementById("loginBox")
                .style.display = "none";


            document
                .getElementById("adminPanel")
                .style.display = "block";


            loadAdminProducts();

        }

    }
);


// ========================================
// ĐĂNG XUẤT
// ========================================

function logoutAdmin() {

    sessionStorage.removeItem(
        "adminPassword"
    );

    location.reload();

}


// ========================================
// THÊM SẢN PHẨM
// ========================================

document
    .getElementById("productForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const password =
                sessionStorage.getItem(
                    "adminPassword"
                );


            if (!password) {

                alert(
                    "Bạn chưa đăng nhập Admin"
                );

                location.reload();

                return;

            }


            const fileInput =
                document.getElementById("file");


            if (
                !fileInput.files ||
                !fileInput.files.length
            ) {

                document
                    .getElementById("status")
                    .innerText =
                    "❌ Vui lòng chọn file!";

                return;

            }


            const data =
                new FormData();


            data.append(
                "name",
                document
                    .getElementById("name")
                    .value
                    .trim()
            );


            data.append(
                "description",
                document
                    .getElementById("description")
                    .value
                    .trim()
            );


            data.append(
                "price",
                document
                    .getElementById("price")
                    .value
            );


            data.append(
                "category",
                document
                    .getElementById("category")
                    .value
            );


            data.append(
                "file",
                fileInput.files[0]
            );


            data.append(
                "password",
                password
            );


            const status =
                document
                    .getElementById("status");


            status.innerText =
                "⏳ Đang tải file lên...";


            try {

                const response =
                    await fetch(
                        "/api/admin/products",
                        {
                            method: "POST",
                            body: data
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.error ||
                        "Không thể thêm sản phẩm"
                    );

                }


                status.innerText =
                    "✅ Thêm sản phẩm thành công!";


                document
                    .getElementById("productForm")
                    .reset();


                // Cập nhật danh sách
                loadAdminProducts();


            } catch (error) {

                console.error(error);

                status.innerText =
                    "❌ " +
                    error.message;

            }

        }
    );


// ========================================
// TẢI DANH SÁCH SẢN PHẨM
// ========================================

async function loadAdminProducts() {

    const productList =
        document.getElementById(
            "productList"
        );


    productList.innerHTML =
        `
        <div class="loading">
            ⏳ Đang tải sản phẩm...
        </div>
        `;


    try {

        const response =
            await fetch(
                "/api/products"
            );


        if (!response.ok) {

            throw new Error(
                "Không thể tải sản phẩm"
            );

        }


        const products =
            await response.json();


        if (
            !Array.isArray(products) ||
            products.length === 0
        ) {

            productList.innerHTML =
                `
                <div class="empty">
                    📦 Chưa có sản phẩm nào.
                </div>
                `;

            return;

        }


        productList.innerHTML =
            products
                .map(
                    product => {

                        return `
                        <div class="product-item">

                            <div class="product-name">
                                ${escapeHTML(
                                    product.name
                                )}
                            </div>

                            <div class="product-info">

                                🆔 ID:
                                ${product.id}

                                <br>

                                💰 Giá:
                                ${Number(
                                    product.price
                                ).toLocaleString(
                                    "vi-VN"
                                )}
                                VNĐ

                                <br>

                                📂 Danh mục:
                                ${escapeHTML(
                                    product.category ||
                                    "Khác"
                                )}

                            </div>

                            <button
                                type="button"
                                class="delete-button"
                                onclick="deleteProduct(
                                    ${product.id},
                                    '${escapeJS(
                                        product.name
                                    )}'
                                )"
                            >
                                🗑️ XÓA SẢN PHẨM
                            </button>

                        </div>
                        `;

                    }
                )
                .join("");


    } catch (error) {

        console.error(error);

        productList.innerHTML =
            `
            <div class="empty">
                ❌ ${escapeHTML(
                    error.message
                )}
            </div>
            `;

    }

}


// ========================================
// XÓA SẢN PHẨM
// ========================================

async function deleteProduct(
    id,
    name
) {

    const password =
        sessionStorage.getItem(
            "adminPassword"
        );


    if (!password) {

        alert(
            "Bạn chưa đăng nhập Admin"
        );

        return;

    }


    const confirmDelete =
        confirm(
            "⚠️ CẢNH BÁO\n\n" +
            "Bạn có chắc muốn xóa sản phẩm:\n\n" +
            name +
            "\n\n" +
            "File bán và dữ liệu sản phẩm " +
            "trong database sẽ bị xóa vĩnh viễn."
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/admin/products/" +
                encodeURIComponent(id),
                {
                    method: "DELETE",

                    headers: {
                        "x-admin-password":
                            password
                    }
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "Không thể xóa sản phẩm"
            );

        }


        alert(
            "✅ Đã xóa sản phẩm và file thành công!"
        );


        // Tải lại danh sách
        loadAdminProducts();


    } catch (error) {

        console.error(error);

        alert(
            "❌ " +
            error.message
        );

    }

}


// ========================================
// BẢO VỆ HTML
// ========================================

function escapeHTML(value) {

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeJS(value) {

    return String(value || "")
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /\n/g,
            "\\n"
        )
        .replace(
            /\r/g,
            "\\r"
        );

}

</script>

</body>

</html>
