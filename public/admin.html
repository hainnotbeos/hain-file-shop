<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Admin - HAIN FILE SHOP</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 30px;

    font-family:
        Arial,
        sans-serif;

    background:
        #0b0b0f;

    color:
        white;

}

.container {

    max-width:
        1000px;

    margin:
        auto;

}

.box {

    background:
        #17171e;

    padding:
        25px;

    border-radius:
        15px;

    margin-bottom:
        25px;

    border:
        1px solid #292933;

}

h1 {

    color:
        #ff3030;

}

h2 {

    color:
        #ff5050;

}

input,
textarea,
select {

    width:
        100%;

    padding:
        12px;

    margin:
        8px 0 15px;

    background:
        #22222b;

    color:
        white;

    border:
        1px solid #444;

    border-radius:
        8px;

}

button {

    padding:
        12px 18px;

    border:
        none;

    border-radius:
        8px;

    cursor:
        pointer;

    font-weight:
        bold;

    color:
        white;

}

.login-btn {

    width:
        100%;

    background:
        #ff3030;

}

.add-btn {

    width:
        100%;

    background:
        #ff3030;

}

.approve {

    background:
        #16a34a;

}

.cancel {

    background:
        #dc2626;

}

.delete {

    background:
        #991b1b;

}

.refresh {

    background:
        #2563eb;

    margin-bottom:
        15px;

}

.logout {

    background:
        #444;

    margin-top:
        20px;

}

#adminPanel {

    display:
        none;

}

#loginStatus,
#status {

    margin-top:
        15px;

}

.order {

    background:
        #22222b;

    padding:
        18px;

    margin-top:
        15px;

    border-radius:
        10px;

    border:
        1px solid #333;

}

.order.pending {

    border-left:
        5px solid orange;

}

.order.paid {

    border-left:
        5px solid #16a34a;

}

.order.cancelled {

    border-left:
        5px solid #dc2626;

}

.order-actions {

    display:
        flex;

    gap:
        10px;

    margin-top:
        15px;

    flex-wrap:
        wrap;

}

.order-actions button {

    flex:
        1;

}

.product {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    background:
        #22222b;

    padding:
        15px;

    margin-top:
        10px;

    border-radius:
        8px;

}

.status {

    font-weight:
        bold;

}

a {

    color:
        white;

    text-decoration:
        none;

}

@media(max-width:600px) {

    body {

        padding:
            15px;

    }

    .product {

        flex-direction:
            column;

        align-items:
            flex-start;

        gap:
            10px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- ================================= -->
<!-- LOGIN -->
<!-- ================================= -->

<div
id="loginBox"
class="box"
>

<h1>
🔐 HAIN FILE SHOP ADMIN
</h1>

<p>
Đăng nhập để quản lý Shop
</p>

<input
id="adminPassword"
type="password"
placeholder="Nhập mật khẩu Admin"
>

<button
class="login-btn"
onclick="loginAdmin()"
>

🔓 ĐĂNG NHẬP

</button>

<div
id="loginStatus"
></div>

</div>


<!-- ================================= -->
<!-- ADMIN -->
<!-- ================================= -->

<div
id="adminPanel"
>


<div class="box">

<h1>
⚡ HAIN FILE SHOP
</h1>

<p>
Quản lý Shop
</p>

<button
class="logout"
onclick="logoutAdmin()"
>

🚪 ĐĂNG XUẤT

</button>

</div>


<!-- ================================= -->
<!-- THÊM SẢN PHẨM -->
<!-- ================================= -->

<div class="box">

<h2>
➕ THÊM SẢN PHẨM
</h2>

<form
id="productForm"
>

<label>
Tên sản phẩm
</label>

<input
id="name"
required
placeholder="Ví dụ: Aimlock V1"
>


<label>
Mô tả
</label>

<textarea
id="description"
placeholder="Mô tả sản phẩm"
></textarea>


<label>
Giá VNĐ
</label>

<input
id="price"
type="number"
required
placeholder="50000"
>


<label>
Danh mục
</label>

<select
id="category"
>

<option value="Free Fire">
Free Fire
</option>

<option value="Minecraft">
Minecraft
</option>

<option value="Preset">
Preset
</option>

<option value="HUD">
HUD
</option>

<option value="Khác">
Khác
</option>

</select>


<label>
File bán
</label>

<input
id="file"
type="file"
required
>


<button
class="add-btn"
type="submit"
>

➕ THÊM SẢN PHẨM

</button>

</form>


<div
id="status"
></div>

</div>


<!-- ================================= -->
<!-- ĐƠN HÀNG -->
<!-- ================================= -->

<div class="box">

<h2>
📋 QUẢN LÝ ĐƠN HÀNG
</h2>

<p>
Kiểm tra tiền đã nhận trong ZaloPay trước khi duyệt.
</p>

<button
class="refresh"
onclick="loadOrders()"
>

🔄 LÀM MỚI ĐƠN HÀNG

</button>


<div
id="orders"
>

Đang tải...

</div>

</div>


<!-- ================================= -->
<!-- SẢN PHẨM -->
<!-- ================================= -->

<div class="box">

<h2>
📦 QUẢN LÝ SẢN PHẨM
</h2>

<div
id="products"
>

Đang tải...

</div>

</div>


</div>


</div>


<script>

// ========================================
// BIẾN
// ========================================

let adminPassword =
    sessionStorage.getItem(
        "adminPassword"
    );


// ========================================
// LOGIN
// ========================================

async function loginAdmin() {

    const password =
        document
            .getElementById(
                "adminPassword"
            )
            .value
            .trim();

    const status =
        document
            .getElementById(
                "loginStatus"
            );

    if(!password) {

        status.innerText =
            "❌ Vui lòng nhập mật khẩu";

        return;

    }

    status.innerText =
        "⏳ Đang kiểm tra...";

    try {

        const response =
            await fetch(
                "/api/admin/login",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            password:
                                password

                        })

                }
            );

        const data =
            await response.json();

        if(!response.ok) {

            throw new Error(
                data.error
            );

        }

        sessionStorage.setItem(
            "adminPassword",
            password
        );

        adminPassword =
            password;

        showAdmin();

    } catch(error) {

        status.innerText =
            "❌ " +
            error.message;

    }

}


// ========================================
// HIỆN ADMIN
// ========================================

function showAdmin() {

    document
        .getElementById(
            "loginBox"
        )
        .style.display =
            "none";

    document
        .getElementById(
            "adminPanel"
        )
        .style.display =
            "block";

    loadOrders();

    loadProducts();

}


// ========================================
// LOGOUT
// ========================================

function logoutAdmin() {

    sessionStorage.removeItem(
        "adminPassword"
    );

    location.reload();

}


// ========================================
// LOAD ĐƠN HÀNG
// ========================================

async function loadOrders() {

    const box =
        document
            .getElementById(
                "orders"
            );

    box.innerHTML =
        "⏳ Đang tải đơn hàng...";

    try {

        const response =
            await fetch(
                "/api/admin/orders",
                {

                    headers: {

                        "x-admin-password":
                            adminPassword

                    }

                }
            );

        const orders =
            await response.json();

        if(!response.ok) {

            throw new Error(
                orders.error
            );

        }

        if(
            orders.length ===
            0
        ) {

            box.innerHTML =
                "📭 Chưa có đơn hàng.";

            return;

        }

        box.innerHTML =
            orders
                .map(
                    order =>
                    `

                    <div
                    class="order ${order.status}"
                    >

                        <h3>
                        🧾 ${order.order_code}
                        </h3>

                        <p>
                        👤 Khách:
                        ${escapeHtml(
                            order.customer_name
                        )}
                        </p>

                        <p>
                        📧 Email:
                        ${escapeHtml(
                            order.customer_email ||
                            "Không có"
                        )}
                        </p>

                        <p>
                        📦 Sản phẩm:
                        ${escapeHtml(
                            order.product_name ||
                            "Sản phẩm đã xóa"
                        )}
                        </p>

                        <p>
                        💰 Số tiền:
                        <b>
                        ${Number(
                            order.amount
                        ).toLocaleString(
                            "vi-VN"
                        )}
                        VNĐ
                        </b>
                        </p>

                        <p>
                        📅 Thời gian:
                        ${order.created_at}
                        </p>

                        <p class="status">
                        Trạng thái:
                        ${getStatusText(
                            order.status
                        )}
                        </p>

                        ${
                            order.status ===
                            "pending"

                            ?

                            `

                            <div
                            class="order-actions"
                            >

                                <button
                                class="approve"
                                onclick=
                                "approveOrder('${order.order_code}')"
                                >

                                ✅ DUYỆT THANH TOÁN

                                </button>

                                <button
                                class="cancel"
                                onclick=
                                "cancelOrder('${order.order_code}')"
                                >

                                ❌ HỦY ĐƠN

                                </button>

                            </div>

                            `

                            :

                            ""

                        }

                    </div>

                    `
                )
                .join("");

    } catch(error) {

        box.innerHTML =
            "❌ " +
            error.message;

    }

}


// ========================================
// DUYỆT ĐƠN
// ========================================

async function approveOrder(
    code
) {

    const confirmApprove =
        confirm(

            "Bạn chắc chắn đã nhận tiền cho đơn " +
            code +
            "?"

        );

    if(
        !confirmApprove
    ) {

        return;

    }

    try {

        const response =
            await fetch(

                "/api/admin/orders/" +
                encodeURIComponent(
                    code
                ) +
                "/approve",

                {

                    method:
                        "POST",

                    headers: {

                        "x-admin-password":
                            adminPassword

                    }

                }

            );

        const data =
            await response.json();

        if(!response.ok) {

            throw new Error(
                data.error
            );

        }

        alert(
            "✅ Đã duyệt đơn!"
        );

        loadOrders();

    } catch(error) {

        alert(
            "❌ " +
            error.message
        );

    }

}


// ========================================
// HỦY ĐƠN
// ========================================

async function cancelOrder(
    code
) {

    if(
        !confirm(
            "Bạn có chắc muốn hủy đơn này?"
        )
    ) {

        return;

    }

    try {

        const response =
            await fetch(

                "/api/admin/orders/" +
                encodeURIComponent(
                    code
                ) +
                "/cancel",

                {

                    method:
                        "POST",

                    headers: {

                        "x-admin-password":
                            adminPassword

                    }

                }

            );

        const data =
            await response.json();

        if(!response.ok) {

            throw new Error(
                data.error
            );

        }

        loadOrders();

    } catch(error) {

        alert(
            "❌ " +
            error.message
        );

    }

}


// ========================================
// TRẠNG THÁI
// ========================================

function getStatusText(
    status
) {

    if(
        status ===
        "pending"
    ) {

        return "🟡 Chờ duyệt";

    }

    if(
        status ===
        "paid"
    ) {

        return "🟢 Đã duyệt";

    }

    if(
        status ===
        "cancelled"
    ) {

        return "🔴 Đã hủy";

    }

    return status;

}


// ========================================
// THÊM SẢN PHẨM
// ========================================

document
    .getElementById(
        "productForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const status =
                document
                    .getElementById(
                        "status"
                    );

            const fileInput =
                document
                    .getElementById(
                        "file"
                    );

            if(
                !fileInput.files.length
            ) {

                status.innerText =
                    "❌ Vui lòng chọn file";

                return;

            }

            const formData =
                new FormData();

            formData.append(
                "name",
                document
                    .getElementById(
                        "name"
                    )
                    .value
            );

            formData.append(
                "description",
                document
                    .getElementById(
                        "description"
                    )
                    .value
            );

            formData.append(
                "price",
                document
                    .getElementById(
                        "price"
                    )
                    .value
            );

            formData.append(
                "category",
                document
                    .getElementById(
                        "category"
                    )
                    .value
            );

            formData.append(
                "file",
                fileInput.files[0]
            );

            formData.append(
                "password",
                adminPassword
            );

            status.innerText =
                "⏳ Đang upload...";

            try {

                const response =
                    await fetch(
                        "/api/admin/products",
                        {

                            method:
                                "POST",

                            body:
                                formData

                        }
                    );

                const data =
                    await response.json();

                if(!response.ok) {

                    throw new Error(
                        data.error
                    );

                }

                status.innerText =
                    "✅ Thêm sản phẩm thành công!";

                document
                    .getElementById(
                        "productForm"
                    )
                    .reset();

                loadProducts();

            } catch(error) {

                status.innerText =
                    "❌ " +
                    error.message;

            }

        }
    );


// ========================================
// LOAD PRODUCTS
// ========================================

async function loadProducts() {

    const box =
        document
            .getElementById(
                "products"
            );

    try {

        const response =
            await fetch(
                "/api/products"
            );

        const products =
            await response.json();

        if(
            products.length ===
            0
        ) {

            box.innerHTML =
                "📭 Chưa có sản phẩm.";

            return;

        }

        box.innerHTML =
            products
                .map(
                    product =>
                    `

                    <div
                    class="product"
                    >

                        <div>

                            <b>
                            ${escapeHtml(
                                product.name
                            )}
                            </b>

                            <br>

                            💰
                            ${Number(
                                product.price
                            ).toLocaleString(
                                "vi-VN"
                            )}
                            VNĐ

                            <br>

                            📁
                            ${escapeHtml(
                                product.category
                            )}

                        </div>

                        <button
                        class="delete"
                        onclick=
                        "deleteProduct(${product.id})"
                        >

                        🗑️ XÓA

                        </button>

                    </div>

                    `
                )
                .join("");

    } catch(error) {

        box.innerHTML =
            "❌ Không thể tải sản phẩm";

    }

}


// ========================================
// XÓA SẢN PHẨM
// ========================================

async function deleteProduct(
    id
) {

    if(
        !confirm(
            "Xóa sản phẩm này và file bán luôn?"
        )
    ) {

        return;

    }

    try {

        const response =
            await fetch(

                "/api/admin/products/" +
                id,

                {

                    method:
                        "DELETE",

                    headers: {

                        "x-admin-password":
                            adminPassword

                    }

                }

            );

        const data =
            await response.json();

        if(!response.ok) {

            throw new Error(
                data.error
            );

        }

        alert(
            "✅ Đã xóa sản phẩm và file!"
        );

        loadProducts();

    } catch(error) {

        alert(
            "❌ " +
            error.message
        );

    }

}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHtml(
    text
) {

    return String(
        text || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


// ========================================
// TỰ ĐỘNG LOGIN
// ========================================

if(
    adminPassword
) {

    showAdmin();

}

</script>

</body>

</html>
