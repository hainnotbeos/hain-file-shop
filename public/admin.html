<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Admin - HAIN FILE SHOP</title>

<style>

* {
box-sizing: border-box;
}

body {

margin: 0;

padding: 40px;

font-family:
Arial,
sans-serif;

background:
#0b0b0f;

color:
white;

}


.box {

max-width:
600px;

margin:
auto;

background:
#17171e;

padding:
30px;

border-radius:
15px;

}


h1 {

color:
#ff3030;

}


input,
textarea,
select {

width:
100%;

padding:
12px;

margin-top:
8px;

margin-bottom:
18px;

background:
#222;

color:
white;

border:
1px solid #444;

border-radius:
8px;

}


button {

width:
100%;

padding:
14px;

background:
#ff3030;

color:
white;

border:
0;

border-radius:
8px;

font-weight:
bold;

cursor:
pointer;

}


#status {

margin-top:
20px;

}


a {

display:
block;

margin-top:
20px;

color:
white;

text-align:
center;

}

</style>

</head>


<body>


<div class="box">


<h1>
⚡ HAIN FILE SHOP
</h1>


<h2>
Thêm sản phẩm
</h2>


<form
id="productForm"
>


<label>
Tên sản phẩm
</label>


<input
id="name"
required
placeholder="Ví dụ: Preset FF"
/>


<label>
Mô tả
</label>


<textarea
id="description"
placeholder="Mô tả sản phẩm"
></textarea>


<label>
Giá
</label>


<input
id="price"
type="number"
required
placeholder="50000"
/>


<label>
Danh mục
</label>


<select
id="category"
>

<option value="Free Fire">
Free Fire
</option>

<option value="Minecraft">
Minecraft
</option>

<option value="Preset">
Preset
</option>

<option value="HUD">
HUD
</option>

<option value="Khác">
Khác
</option>

</select>


<label>
File bán
</label>


<input
id="file"
type="file"
required
/>


<button
type="submit"
>

➕ THÊM SẢN PHẨM

</button>


</form>


<div
id="status"
>
</div>


<a href="/">
← Về Hain File Shop
</a>


</div>



<script>

const form =

document.getElementById(
"productForm"
);


const status =

document.getElementById(
"status"
);


form.addEventListener(

"submit",

async function(event) {


event.preventDefault();


const fileInput =

document.getElementById(
"file"
);


if(
!fileInput.files.length
) {

status.innerText =

"❌ Vui lòng chọn file!";

return;

}


const data =

new FormData();


data.append(

"name",

document.getElementById(
"name"
).value

);


data.append(

"description",

document.getElementById(
"description"
).value

);


data.append(

"price",

document.getElementById(
"price"
).value

);


data.append(

"category",

document.getElementById(
"category"
).value

);


data.append(

"file",

fileInput.files[0]

);


status.innerText =

"⏳ Đang tải file...";


try {


const response =

await fetch(

"/api/admin/products",

{

method:
"POST",

body:
data

}

);


const result =

await response.json();


if(
!response.ok
) {

throw new Error(
result.error
);

}


status.innerText =

"✅ Thêm sản phẩm thành công!";


form.reset();


}

catch(error) {


status.innerText =

"❌ " +

error.message;


}

}

);

</script>


</body>

</html>
