<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>Admin - HAIN FILE SHOP</title>

<style>

* {
box-sizing: border-box;
}

body {

margin: 0;

padding: 40px;

font-family:
Arial,
sans-serif;

background:
#0b0b0f;

color:
white;

}


.box {

max-width:
600px;

margin:
auto;

background:
#17171e;

padding:
30px;

border-radius:
15px;

}


h1 {

color:
#ff3030;

}


input,
textarea,
select {

width:
100%;

padding:
12px;

margin-top:
8px;

margin-bottom:
18px;

background:
#222;

color:
white;

border:
1px solid #444;

border-radius:
8px;

}


button {

width:
100%;

padding:
14px;

background:
#ff3030;

color:
white;

border:
0;

border-radius:
8px;

font-weight:
bold;

cursor:
pointer;

}


button:hover {

opacity:
0.85;

}


#status {

margin-top:
20px;

}


#loginBox {

display:
block;

}


#adminPanel {

display:
none;

}


.login-title {

color:
#ff3030;

}


.logout {

margin-top:
20px;

background:
#444;

}


a {

display:
block;

margin-top:
20px;

color:
white;

text-align:
center;

}

</style>

</head>

<body>

<div class="box">

<h1>
⚡ HAIN FILE SHOP
</h1>

<!-- ================================= -->

<!-- LOGIN ADMIN -->

<!-- ================================= -->

<div
id="loginBox"
>

<h2
class="login-title"
>

🔐 ADMIN

</h2>

<p>

Nhập mật khẩu để quản lý sản phẩm.

</p>

<input
id="adminPassword"
type="password"
placeholder="Nhập mật khẩu Admin"

>

<button
onclick="loginAdmin()"

>

🔓 ĐĂNG NHẬP ADMIN

</button>

<div
id="loginStatus"
style="
margin-top:15px;
"
>

</div>

</div>

<!-- ================================= -->

<!-- ADMIN PANEL -->

<!-- ================================= -->

<div
id="adminPanel"
>

<h2>

➕ THÊM SẢN PHẨM

</h2>

<form
id="productForm"
>

<label>
Tên sản phẩm
</label>

<input
id="name"
required
placeholder="Ví dụ: Preset FF"

>

<label>
Mô tả
</label>

<textarea
id="description"
placeholder="Mô tả sản phẩm"
></textarea>

<label>
Giá
</label>

<input
id="price"
type="number"
required
placeholder="50000"

>

<label>
Danh mục
</label>

<select
id="category"

>

<option value="Free Fire">
Free Fire
</option>

<option value="Minecraft">
Minecraft
</option>

<option value="Preset">
Preset
</option>

<option value="HUD">
HUD
</option>

<option value="Khác">
Khác
</option>

</select>

<label>
File bán
</label>

<input
id="file"
type="file"
required

>

<button
type="submit"

>

➕ THÊM SẢN PHẨM

</button>

</form>

<div
id="status"
>

</div>

<button
class="logout"
onclick="logoutAdmin()"

>

🚪 ĐĂNG XUẤT

</button>

</div>

<a href="/">

← Về HAIN FILE SHOP

</a>

</div>

<script>


// ========================================
// ĐĂNG NHẬP ADMIN
// ========================================

async function loginAdmin() {


const password =

document.getElementById(
"adminPassword"
).value;


const loginStatus =

document.getElementById(
"loginStatus"
);


if (
!password
) {

loginStatus.innerText =

"❌ Vui lòng nhập mật khẩu";

return;

}


loginStatus.innerText =

"⏳ Đang kiểm tra...";


try {


const response =

await fetch(

"/api/admin/login",

{

method:
"POST",

headers: {

"Content-Type":
"application/json"

},

body:

JSON.stringify({

password:
password

})

}

);


const result =

await response.json();


if (
!response.ok
) {

throw new Error(

result.error ||

"Mật khẩu không đúng"

);

}


sessionStorage.setItem(

"adminPassword",

password

);


document.getElementById(
"loginBox"
).style.display =

"none";


document.getElementById(
"adminPanel"
).style.display =

"block";


loginStatus.innerText =

"";


}

catch(error) {


loginStatus.innerText =

"❌ " +

error.message;


}

}


// ========================================
// TỰ ĐỘNG ĐĂNG NHẬP
// ========================================

window.addEventListener(

"DOMContentLoaded",

function() {


const savedPassword =

sessionStorage.getItem(
"adminPassword"
);


if (
savedPassword
) {


document.getElementById(
"loginBox"
).style.display =

"none";


document.getElementById(
"adminPanel"
).style.display =

"block";


}

}

);


// ========================================
// ĐĂNG XUẤT
// ========================================

function logoutAdmin() {


sessionStorage.removeItem(

"adminPassword"

);


location.reload();

}


// ========================================
// THÊM SẢN PHẨM
// ========================================

document
.getElementById(
"productForm"
)
.addEventListener(

"submit",

async function(event) {


event.preventDefault();


const password =

sessionStorage.getItem(
"adminPassword"
);


if (
!password
) {

alert(
"Bạn chưa đăng nhập Admin"
);

location.reload();

return;

}


const fileInput =

document.getElementById(
"file"
);


if (
!fileInput.files.length
) {

document.getElementById(
"status"
).innerText =

"❌ Vui lòng chọn file!";

return;

}


const data =

new FormData();


data.append(

"name",

document.getElementById(
"name"
).value

);


data.append(

"description",

document.getElementById(
"description"
).value

);


data.append(

"price",

document.getElementById(
"price"
).value

);


data.append(

"category",

document.getElementById(
"category"
).value

);


data.append(

"file",

fileInput.files[0]

);


// GỬI MẬT KHẨU

data.append(

"password",

password

);


const status =

document.getElementById(
"status"
);


status.innerText =

"⏳ Đang tải file...";


try {


const response =

await fetch(

"/api/admin/products",

{

method:
"POST",

body:
data

}

);


const result =

await response.json();


if (
!response.ok
) {

throw new Error(

result.error ||

"Không thể thêm sản phẩm"

);

}


status.innerText =

"✅ Thêm sản phẩm thành công!";


document
.getElementById(
"productForm"
)
.reset();


}

catch(error) {


status.innerText =

"❌ " +

error.message;


}

}

);

</script>

</body>

</html>
